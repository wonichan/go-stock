# go-stock Web 自托管：应用 + Cloudflare Tunnel（cloudflared 主动外连，宿主机默认不暴露任何端口）
# 用法：cp .env.web.example .env && 编辑 .env && docker compose up -d --build
# 详见 README-web.md

services:
  go-stock:
    build:
      context: .
      # 可选：国内网络可在 .env 中设置镜像源（留空使用官方源）
      args:
        GOPROXY: ${GOPROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        APT_MIRROR: ${APT_MIRROR:-}
        # 前端 vite 构建实测需 ~3GB 堆，而 Dockerfile 默认给 4096MB —— 在 3.6GB 内存的
        # 机器上直接用默认值会把整机打爆（2026-10-17 实测死机）。压到 3072，不够可调大。
        NODE_MAX_OLD_SPACE: ${NODE_MAX_OLD_SPACE:-3072}
    image: go-stock-web:local
    restart: unless-stopped
    environment:
      # 鉴权（至少配置一种；经 Tunnel 暴露时强烈建议启用 Cloudflare Access）
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      GO_STOCK_WEB_PASSWORD: ${GO_STOCK_WEB_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - go-stock-data:/data
      # 寻龙诀（/opt/xunlongjue）脚本结果的只读桥接目录：脚本写
      # ./data/xunlongjue/morning_push.json，应用只读该目录（Q5=T1 文件桥）。
      - ./data/xunlongjue:/data/xunlongjue:ro
    shm_size: 1g          # Chromium 抓取需要较大的 /dev/shm
    mem_limit: 3g
    # Q9=S1：寻龙诀运行在宿主机，需要经 HTTP 调用 go-stock 的 PickAStock「选好票」入口。
    # 只绑回环，不对外。Dockerfile 已设 GO_STOCK_LISTEN=0.0.0.0:8080（容器内需绑全网卡
    # 端口转发才通），而 main_server.go 对非回环监听强制要求鉴权，所以 .env 里的
    # GO_STOCK_WEB_PASSWORD 必须有值，否则容器会直接 Fatal 退出。
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]
    # AstrBot 跑在宿主机、监听 0.0.0.0:6185；而容器内的 127.0.0.1 是容器自己，
    # 所以推送地址必须写 host.docker.internal，这里把它映射到宿主网关。
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?请在 .env 中设置 TUNNEL_TOKEN（Cloudflare Zero Trust → Networks → Tunnels）}
    depends_on:
      - go-stock
    networks: [internal]

volumes:
  go-stock-data:

networks:
  internal:
